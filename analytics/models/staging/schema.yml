    columns:
      - name: shift_id
        data_tests: [not_null]
      - name: _created_at
        description: "Actual source database insertion time; trigger-managed and immutable. Existing records adopt migration time; not the business event date."
      - name: _last_updated_at
        description: "Latest source-row database INSERT/UPDATE time, including soft deletion/restoration. Not commit-order CDC or the refresh time of this derived model or its joined records."
      - name: _is_deleted
        description: "Source soft-deletion flag. Raw staging retains both states; core/facts retain the latest tombstone for propagation, while reporting marts filter true. Independent of business status and is_active; no automatic cascade."
      - name: _deleted_at
        description: "Time of the current source soft-deletion episode, set when the flag becomes true, preserved while true, NULL after restoration. Not a refund date."
  - name: stg_cash_movements
    description: Raw cash-drawer movements.
    columns:
      - name: cash_movement_id
        data_tests: [not_null]
      - name: _created_at
        description: "Actual source database insertion time; trigger-managed and immutable. Existing records adopt migration time; not the business event date."
      - name: _last_updated_at
        description: "Latest source-row database INSERT/UPDATE time, including soft deletion/restoration. Not commit-order CDC or the refresh time of this derived model or its joined records."
      - name: _is_deleted
        description: "Source soft-deletion flag. Raw staging retains both states; core/facts retain the latest tombstone for propagation, while reporting marts filter true. Independent of business status and is_active; no automatic cascade."
      - name: _deleted_at
        description: "Time of the current source soft-deletion episode, set when the flag becomes true, preserved while true, NULL after restoration. Not a refund date."
  - name: stg_simulation_runs
    description: Raw simulator-run audit records.
    columns:
      - name: simulation_run_id
        data_tests: [not_null]
