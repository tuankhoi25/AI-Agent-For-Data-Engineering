      - name: simulation_runs
      - name: weather_daily
        description: >-
          Daily historical weather observations fetched from Open-Meteo for
          the bakery weather location. The source row is refreshed when the
          external historical payload is re-collected.
        columns:
          - name: weather_date
            description: Local calendar date of the weather observation in the recorded timezone.
          - name: location_code
            description: Stable configured weather location identifier.
          - name: weather_source
            description: External provider and endpoint family for the observation.
          - name: _created_at
            description: Database insertion timestamp managed by the source row-audit trigger.
          - name: _last_updated_at
            description: Latest source-row update timestamp used for incremental extraction.
          - name: _is_deleted
            description: Source soft-deletion flag retained by staging for correction propagation.
          - name: _deleted_at
            description: Timestamp of the current source soft-deletion episode, when applicable.
