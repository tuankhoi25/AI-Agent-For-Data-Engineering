version: 2

sources:
  - name: bakery
    description: >-
      Operational PostgreSQL schema for Maison Douce. These tables are the
      system of record for catalog, procurement, inventory, production,
      sales, payments, loyalty, returns, waste and cash operations.
    database: "{{ env_var('POSTGRES_DB', 'bakery') }}"
    schema: bakery
    meta:
      owner: bakery-operations
      timezone: Asia/Ho_Chi_Minh
      currency: VND
    tables:
      - name: branches
        columns:
          - name: _created_at
            description: "Actual source database insertion time; trigger-managed and immutable. Existing records adopt migration time; not the business event date."
          - name: _last_updated_at
            description: "Latest source-row database INSERT/UPDATE time, including soft deletion/restoration. Not commit-order CDC or the refresh time of this derived model or its joined records."
          - name: _is_deleted
            description: "Source soft-deletion flag. Raw staging retains both states; core/facts and Cube exclude true. Independent of business status and is_active; no automatic cascade."
          - name: _deleted_at
            description: "Time of the current source soft-deletion episode, set when the flag becomes true, preserved while true, NULL after restoration. Not a refund date."
