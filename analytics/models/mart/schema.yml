  - name: fct_sale_items
    description: Sale-line fact keyed to mart SCD2 dimensions.
    columns:
      - name: sale_item_id
        data_tests: [not_null, unique]
  - name: dim_date
    description: Type 0 calendar dimension for local business-date analysis; it is intentionally not SCD2 because calendar attributes are stable.
    columns:
      - name: date_sk
        data_tests: [not_null, unique]
      - name: date_day
        data_tests: [not_null, unique]
      - name: is_weekend
        data_tests: [not_null]
      - name: is_vietnam_holiday
        data_tests: [not_null]
  - name: fct_daily_weather
    description: Daily historical weather measurements at location grain, joined to dim_date by date_sk.
    columns:
      - name: date_sk
        data_tests: [not_null]
      - name: weather_date
        data_tests: [not_null]
      - name: location_code
        data_tests: [not_null]
      - name: weather_source
        data_tests: [not_null]
  - name: mart_daily_sales
    description: Branch/day sales KPI mart.
    columns:
      - name: business_date
        data_tests: [not_null]
      - name: order_count
        data_tests: [not_null]
  - name: mart_product_sales
    description: Branch/day/product sales mart.
    columns:
      - name: business_date
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
  - name: mart_inventory_position
    description: Current branch/item/lot inventory position from the signed ledger.
    columns:
      - name: as_of_date
        data_tests: [not_null]
      - name: stock_item_id
        data_tests: [not_null]
  - name: mart_customer_360
    description: Customer sales and loyalty summary.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
  - name: mart_cash_reconciliation
    description: Shift-level cash drawer reconciliation.
  - name: mart_procurement_status
    description: Purchase-order-line fulfillment and unit comparability mart.
    columns:
      - name: purchase_order_item_id
        data_tests: [not_null, unique]
  - name: mart_daily_operations
    description: Branch/day/unit production and waste mart; incompatible units are not summed together.
    columns:
      - name: business_date
        data_tests: [not_null]
      - name: uom_id
        data_tests: [not_null]
