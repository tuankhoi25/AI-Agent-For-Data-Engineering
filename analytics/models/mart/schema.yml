version: 2

models:
  - name: dim_allergens
    description: SCD2 allergen dimension.
    columns:
      - name: allergen_id
        data_tests: [not_null]
      - name: _valid_from
        description: "Effective interval start; -infinity for the initial inferred history before the first observation."
        data_tests: [not_null]
      - name: _observed_from
        description: "Actual start timestamp recorded by the dbt snapshot; earlier descriptive history is unknown."
        data_tests: [not_null]
      - name: _valid_to
      - name: _is_current
        data_tests: [not_null]
      - name: allergen_sk
        data_tests: [not_null, unique]
