cubes:
  - name: sale_items
    sql: SELECT * FROM bakery.sale_items WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: products
        sql: '{CUBE}.product_id = {products.product_id}'
        relationship: many_to_one
      - name: sales
        sql: '{CUBE}.sale_id = {sales.sale_id}'
        relationship: many_to_one
      - name: units_of_measure
        sql: '{CUBE}.uom_id = {units_of_measure.uom_id}'
        relationship: many_to_one
    dimensions:
      - name: sale_item_id
        sql: sale_item_id
        type: number
        primary_key: true
      - name: sale_id
        sql: sale_id
        type: number
      - name: product_id
        sql: product_id
        type: number
      - name: quantity
        sql: quantity
        type: number
      - name: uom_id
        sql: uom_id
        type: number
      - name: product_name_snapshot
        sql: product_name_snapshot
        type: string
      - name: unit_price
        sql: unit_price
        type: number
      - name: discount_amount
        sql: discount_amount
        type: number
      - name: line_total
        sql: line_total
        type: number
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: units_sold
        type: sum
        sql: quantity
      - name: gross_line_sales
        type: sum
        sql: '{CUBE}.quantity * {CUBE}.unit_price'
      - name: item_discount_amount
        type: sum
        sql: discount_amount
      - name: net_line_sales
        type: sum
        sql: line_total
    pre_aggregations:
      - name: product_sales_by_day
        type: rollup
        refresh_key:
          every: 1 minute
        measures:
          - CUBE.units_sold
          - CUBE.gross_line_sales
          - CUBE.item_discount_amount
          - CUBE.net_line_sales
        dimensions:
          - products.product_name
          - products.category_id
          - sales.branch_id
          - sales.channel
        time_dimension: sales.completed_at
        granularity: day
