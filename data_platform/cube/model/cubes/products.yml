cubes:
  - name: products
    sql: SELECT * FROM bakery.products WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: product_categories
        sql: '{CUBE}.category_id = {product_categories.category_id}'
        relationship: many_to_one
      - name: units_of_measure
        sql: '{CUBE}.sell_uom_id = {units_of_measure.uom_id}'
        relationship: many_to_one
      - name: stock_items
        sql: '{CUBE}.stock_item_id = {stock_items.stock_item_id}'
        relationship: many_to_one
    dimensions:
      - name: product_id
        sql: product_id
        type: number
        primary_key: true
      - name: sku
        sql: sku
        type: string
      - name: product_name
        sql: product_name
        type: string
      - name: category_id
        sql: category_id
        type: number
      - name: product_type
        sql: product_type
        type: string
      - name: sell_uom_id
        sql: sell_uom_id
        type: number
      - name: stock_item_id
        sql: stock_item_id
        type: number
      - name: description
        sql: description
        type: string
      - name: ingredient_summary
        sql: ingredient_summary
        type: string
      - name: unit_price
        sql: unit_price
        type: number
      - name: is_active
        sql: is_active
        type: boolean
      - name: available_from
        sql: available_from
        type: time
      - name: available_to
        sql: available_to
        type: time
      - name: created_at
        sql: created_at
        type: time
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: active_products
        type: sum
        sql: CASE WHEN {CUBE}.is_active THEN 1 ELSE 0 END
      - name: average_list_price
        type: avg
        sql: unit_price
