cubes:
  - name: units_of_measure
    sql: SELECT * FROM bakery.units_of_measure WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins: []
    dimensions:
      - name: uom_id
        sql: uom_id
        type: number
        primary_key: true
      - name: uom_code
        sql: uom_code
        type: string
      - name: uom_name
        sql: uom_name
        type: string
      - name: dimension
        sql: dimension
        type: string
      - name: is_base_unit
        sql: is_base_unit
        type: boolean
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
