cubes:
  - name: supplier_products
    sql: SELECT * FROM bakery.supplier_products WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: units_of_measure
        sql: '{CUBE}.purchase_uom_id = {units_of_measure.uom_id}'
        relationship: many_to_one
      - name: stock_items
        sql: '{CUBE}.stock_item_id = {stock_items.stock_item_id}'
        relationship: many_to_one
      - name: suppliers
        sql: '{CUBE}.supplier_id = {suppliers.supplier_id}'
        relationship: many_to_one
    dimensions:
      - name: supplier_product_id
        sql: supplier_product_id
        type: number
        primary_key: true
      - name: supplier_id
        sql: supplier_id
        type: number
      - name: stock_item_id
        sql: stock_item_id
        type: number
      - name: supplier_sku
        sql: supplier_sku
        type: string
      - name: brand_name
        sql: brand_name
        type: string
      - name: purchase_uom_id
        sql: purchase_uom_id
        type: number
      - name: pack_size
        sql: pack_size
        type: number
      - name: pack_uom_id
        sql: pack_uom_id
        type: number
      - name: last_known_unit_cost
        sql: last_known_unit_cost
        type: number
      - name: currency_code
        sql: currency_code
        type: string
      - name: is_active
        sql: is_active
        type: boolean
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: average_last_known_unit_cost
        type: avg
        sql: last_known_unit_cost
