cubes:
  - name: inventory_lots
    sql: SELECT * FROM bakery.inventory_lots WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: goods_receipts
        sql: '{CUBE}.goods_receipt_id = {goods_receipts.goods_receipt_id}'
        relationship: many_to_one
      - name: stock_items
        sql: '{CUBE}.stock_item_id = {stock_items.stock_item_id}'
        relationship: many_to_one
    dimensions:
      - name: inventory_lot_id
        sql: inventory_lot_id
        type: number
        primary_key: true
      - name: stock_item_id
        sql: stock_item_id
        type: number
      - name: lot_code
        sql: lot_code
        type: string
      - name: supplier_lot_code
        sql: supplier_lot_code
        type: string
      - name: goods_receipt_id
        sql: goods_receipt_id
        type: number
      - name: manufactured_at
        sql: manufactured_at
        type: time
      - name: received_at
        sql: received_at
        type: time
      - name: expires_at
        sql: expires_at
        type: time
      - name: unit_cost
        sql: unit_cost
        type: number
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: average_unit_cost
        type: avg
        sql: unit_cost
