cubes:
  - name: suppliers
    sql: SELECT * FROM bakery.suppliers WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins: []
    dimensions:
      - name: supplier_id
        sql: supplier_id
        type: number
        primary_key: true
      - name: supplier_code
        sql: supplier_code
        type: string
      - name: supplier_name
        sql: supplier_name
        type: string
      - name: supplier_type
        sql: supplier_type
        type: string
      - name: country_code
        sql: country_code
        type: string
      - name: website
        sql: website
        type: string
      - name: phone
        sql: phone
        type: string
      - name: email
        sql: email
        type: string
      - name: address
        sql: address
        type: string
      - name: is_active
        sql: is_active
        type: boolean
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: active_suppliers
        type: sum
        sql: CASE WHEN {CUBE}.is_active THEN 1 ELSE 0 END
