cubes:
  - name: sales
    sql: SELECT * FROM bakery.sales WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: branches
        sql: '{CUBE}.branch_id = {branches.branch_id}'
        relationship: many_to_one
      - name: employees
        sql: '{CUBE}.cashier_id = {employees.employee_id}'
        relationship: many_to_one
      - name: customers
        sql: '{CUBE}.customer_id = {customers.customer_id}'
        relationship: many_to_one
    dimensions:
      - name: sale_id
        sql: sale_id
        type: number
        primary_key: true
      - name: receipt_number
        sql: receipt_number
        type: string
      - name: branch_id
        sql: branch_id
        type: number
      - name: customer_id
        sql: customer_id
        type: number
      - name: cashier_id
        sql: cashier_id
        type: number
      - name: channel
        sql: channel
        type: string
      - name: status
        sql: status
        type: string
      - name: opened_at
        sql: opened_at
        type: time
      - name: completed_at
        sql: completed_at
        type: time
      - name: subtotal
        sql: subtotal
        type: number
      - name: discount_total
        sql: discount_total
        type: number
      - name: tax_total
        sql: tax_total
        type: number
      - name: total_amount
        sql: total_amount
        type: number
      - name: idempotency_key
        sql: idempotency_key
        type: string
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: gross_sales
        type: sum
        sql: subtotal
      - name: discount_amount
        type: sum
        sql: discount_total
      - name: tax_amount
        type: sum
        sql: tax_total
      - name: total_sales_amount
        type: sum
        sql: total_amount
      - name: average_ticket
        type: avg
        sql: total_amount
    pre_aggregations:
      - name: sales_by_day
        type: rollup
        refresh_key:
          every: 1 minute
        measures:
          - CUBE.count
          - CUBE.gross_sales
          - CUBE.discount_amount
          - CUBE.tax_amount
          - CUBE.total_sales_amount
        dimensions:
          - branches.branch_name
          - CUBE.channel
          - CUBE.status
        time_dimension: CUBE.completed_at
        granularity: day
