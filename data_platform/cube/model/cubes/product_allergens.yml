cubes:
  - name: product_allergens
    sql: SELECT * FROM bakery.product_allergens WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: allergens
        sql: '{CUBE.allergen_id} = {allergens.allergen_id}'
        relationship: many_to_one
      - name: products
        sql: '{CUBE.product_id} = {products.product_id}'
        relationship: many_to_one
    dimensions:
      - name: product_allergen_key
        sql: "{CUBE}.product_id::text || ':' || {CUBE}.allergen_id::text"
        type: string
        primary_key: true
      - name: product_id
        sql: product_id
        type: number
      - name: allergen_id
        sql: allergen_id
        type: number
      - name: is_confirmed
        sql: is_confirmed
        type: boolean
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: confirmed_mappings
        type: sum
        sql: CASE WHEN {CUBE}.is_confirmed THEN 1 ELSE 0 END
