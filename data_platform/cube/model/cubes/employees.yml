cubes:
  - name: employees
    sql: SELECT * FROM bakery.employees WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: branches
        sql: '{CUBE}.branch_id = {branches.branch_id}'
        relationship: many_to_one
    dimensions:
      - name: employee_id
        sql: employee_id
        type: number
        primary_key: true
      - name: branch_id
        sql: branch_id
        type: number
      - name: employee_code
        sql: employee_code
        type: string
      - name: full_name
        sql: full_name
        type: string
      - name: role_name
        sql: role_name
        type: string
      - name: phone
        sql: phone
        type: string
      - name: hired_on
        sql: hired_on
        type: time
      - name: terminated_on
        sql: terminated_on
        type: time
      - name: is_active
        sql: is_active
        type: boolean
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: active_employees
        type: sum
        sql: CASE WHEN {CUBE}.is_active THEN 1 ELSE 0 END
