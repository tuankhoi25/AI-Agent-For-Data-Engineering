cubes:
  - name: waste_records
    sql: SELECT * FROM bakery.waste_records WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: branches
        sql: '{CUBE}.branch_id = {branches.branch_id}'
        relationship: many_to_one
      - name: inventory_lots
        sql: '{CUBE}.inventory_lot_id = {inventory_lots.inventory_lot_id}'
        relationship: many_to_one
      - name: employees
        sql: '{CUBE}.recorded_by = {employees.employee_id}'
        relationship: many_to_one
      - name: stock_items
        sql: '{CUBE}.stock_item_id = {stock_items.stock_item_id}'
        relationship: many_to_one
      - name: units_of_measure
        sql: '{CUBE}.uom_id = {units_of_measure.uom_id}'
        relationship: many_to_one
    dimensions:
      - name: waste_record_id
        sql: waste_record_id
        type: number
        primary_key: true
      - name: branch_id
        sql: branch_id
        type: number
      - name: stock_item_id
        sql: stock_item_id
        type: number
      - name: inventory_lot_id
        sql: inventory_lot_id
        type: number
      - name: quantity
        sql: quantity
        type: number
      - name: uom_id
        sql: uom_id
        type: number
      - name: reason_code
        sql: reason_code
        type: string
      - name: recorded_at
        sql: recorded_at
        type: time
      - name: recorded_by
        sql: recorded_by
        type: number
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: wasted_quantity
        type: sum
        sql: quantity
    pre_aggregations:
      - name: waste_by_day
        type: rollup
        refresh_key:
          every: 1 minute
        measures:
          - CUBE.count
          - CUBE.wasted_quantity
        dimensions:
          - branches.branch_name
          - stock_items.stock_item_name
          - CUBE.reason_code
          - units_of_measure.uom_code
        time_dimension: CUBE.recorded_at
        granularity: day
