cubes:
  - name: payments
    sql: SELECT * FROM bakery.payments WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: sales
        sql: '{CUBE}.sale_id = {sales.sale_id}'
        relationship: many_to_one
    dimensions:
      - name: payment_id
        sql: payment_id
        type: number
        primary_key: true
      - name: sale_id
        sql: sale_id
        type: number
      - name: payment_method
        sql: payment_method
        type: string
      - name: amount
        sql: amount
        type: number
      - name: currency_code
        sql: currency_code
        type: string
      - name: status
        sql: status
        type: string
      - name: paid_at
        sql: paid_at
        type: time
      - name: provider_reference
        sql: provider_reference
        type: string
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: payment_amount
        type: sum
        sql: amount
      - name: captured_payment_amount
        type: sum
        sql: CASE WHEN {CUBE}.status = 'CAPTURED' THEN {CUBE}.amount ELSE 0 END
    pre_aggregations:
      - name: payments_by_day
        type: rollup
        refresh_key:
          every: 1 minute
        measures:
          - CUBE.count
          - CUBE.captured_payment_amount
        dimensions:
          - CUBE.payment_method
          - CUBE.status
          - CUBE.currency_code
          - sales.branch_id
        time_dimension: CUBE.paid_at
        granularity: day
