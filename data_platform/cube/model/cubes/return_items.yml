cubes:
  - name: return_items
    sql: SELECT * FROM bakery.return_items WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: returns
        sql: '{CUBE}.return_id = {returns.return_id}'
        relationship: many_to_one
      - name: sale_items
        sql: '{CUBE}.sale_item_id = {sale_items.sale_item_id}'
        relationship: many_to_one
    dimensions:
      - name: return_item_id
        sql: return_item_id
        type: number
        primary_key: true
      - name: return_id
        sql: return_id
        type: number
      - name: sale_item_id
        sql: sale_item_id
        type: number
      - name: quantity
        sql: quantity
        type: number
      - name: restockable
        sql: restockable
        type: boolean
      - name: refund_amount
        sql: refund_amount
        type: number
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: returned_quantity
        type: sum
        sql: quantity
      - name: item_refund_amount
        type: sum
        sql: refund_amount
