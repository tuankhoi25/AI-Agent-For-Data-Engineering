cubes:
  - name: recipes
    sql: SELECT * FROM bakery.recipes WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: products
        sql: '{CUBE}.product_id = {products.product_id}'
        relationship: many_to_one
      - name: units_of_measure
        sql: '{CUBE}.yield_uom_id = {units_of_measure.uom_id}'
        relationship: many_to_one
    dimensions:
      - name: recipe_id
        sql: recipe_id
        type: number
        primary_key: true
      - name: product_id
        sql: product_id
        type: number
      - name: recipe_version
        sql: recipe_version
        type: string
      - name: yield_quantity
        sql: yield_quantity
        type: number
      - name: yield_uom_id
        sql: yield_uom_id
        type: number
      - name: effective_from
        sql: effective_from
        type: time
      - name: effective_to
        sql: effective_to
        type: time
      - name: instructions
        sql: instructions
        type: string
      - name: is_active
        sql: is_active
        type: boolean
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: active_recipes
        type: sum
        sql: CASE WHEN {CUBE}.is_active THEN 1 ELSE 0 END
