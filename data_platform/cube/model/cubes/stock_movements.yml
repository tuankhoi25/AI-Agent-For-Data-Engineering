cubes:
  - name: stock_movements
    sql: SELECT * FROM bakery.stock_movements WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: branches
        sql: '{CUBE}.branch_id = {branches.branch_id}'
        relationship: many_to_one
      - name: employees
        sql: '{CUBE}.created_by = {employees.employee_id}'
        relationship: many_to_one
      - name: inventory_lots
        sql: '{CUBE}.inventory_lot_id = {inventory_lots.inventory_lot_id}'
        relationship: many_to_one
      - name: stock_items
        sql: '{CUBE}.stock_item_id = {stock_items.stock_item_id}'
        relationship: many_to_one
      - name: units_of_measure
        sql: '{CUBE}.uom_id = {units_of_measure.uom_id}'
        relationship: many_to_one
    dimensions:
      - name: stock_movement_id
        sql: stock_movement_id
        type: number
        primary_key: true
      - name: branch_id
        sql: branch_id
        type: number
      - name: stock_item_id
        sql: stock_item_id
        type: number
      - name: inventory_lot_id
        sql: inventory_lot_id
        type: number
      - name: movement_type
        sql: movement_type
        type: string
      - name: quantity_delta
        sql: quantity_delta
        type: number
      - name: uom_id
        sql: uom_id
        type: number
      - name: unit_cost
        sql: unit_cost
        type: number
      - name: occurred_at
        sql: occurred_at
        type: time
      - name: source_type
        sql: source_type
        type: string
      - name: source_id
        sql: source_id
        type: number
      - name: idempotency_key
        sql: idempotency_key
        type: string
      - name: created_by
        sql: created_by
        type: number
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: net_quantity_change
        type: sum
        sql: quantity_delta
      - name: stock_value_change
        type: sum
        sql: '{CUBE}.quantity_delta * {CUBE}.unit_cost'
    pre_aggregations:
      - name: stock_movements_by_day
        type: rollup
        refresh_key:
          every: 1 minute
        measures:
          - CUBE.count
          - CUBE.net_quantity_change
          - CUBE.stock_value_change
        dimensions:
          - branches.branch_name
          - stock_items.stock_item_name
          - CUBE.movement_type
          - units_of_measure.uom_code
        time_dimension: CUBE.occurred_at
        granularity: day
