cubes:
  - name: promotion_products
    sql: SELECT * FROM bakery.promotion_products WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: products
        sql: '{CUBE.product_id} = {products.product_id}'
        relationship: many_to_one
      - name: promotions
        sql: '{CUBE.promotion_id} = {promotions.promotion_id}'
        relationship: many_to_one
    dimensions:
      - name: promotion_product_key
        sql: "{CUBE}.promotion_id::text || ':' || {CUBE}.product_id::text"
        type: string
        primary_key: true
      - name: promotion_id
        sql: promotion_id
        type: number
      - name: product_id
        sql: product_id
        type: number
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
