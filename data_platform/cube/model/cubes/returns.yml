cubes:
  - name: returns
    sql: SELECT * FROM bakery.returns WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: employees
        sql: '{CUBE}.processed_by = {employees.employee_id}'
        relationship: many_to_one
      - name: sales
        sql: '{CUBE}.sale_id = {sales.sale_id}'
        relationship: many_to_one
    dimensions:
      - name: return_id
        sql: return_id
        type: number
        primary_key: true
      - name: return_number
        sql: return_number
        type: string
      - name: sale_id
        sql: sale_id
        type: number
      - name: processed_by
        sql: processed_by
        type: number
      - name: returned_at
        sql: returned_at
        type: time
      - name: reason
        sql: reason
        type: string
      - name: status
        sql: status
        type: string
      - name: refund_total
        sql: refund_total
        type: number
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: refund_amount
        type: sum
        sql: refund_total
    pre_aggregations:
      - name: returns_by_day
        type: rollup
        refresh_key:
          every: 1 minute
        measures:
          - CUBE.count
          - CUBE.refund_amount
        dimensions:
          - sales.branch_id
          - CUBE.status
        time_dimension: CUBE.returned_at
        granularity: day
