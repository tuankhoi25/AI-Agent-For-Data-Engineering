cubes:
  - name: purchase_order_items
    sql: SELECT * FROM bakery.purchase_order_items WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: purchase_orders
        sql: '{CUBE}.purchase_order_id = {purchase_orders.purchase_order_id}'
        relationship: many_to_one
      - name: stock_items
        sql: '{CUBE}.stock_item_id = {stock_items.stock_item_id}'
        relationship: many_to_one
      - name: units_of_measure
        sql: '{CUBE}.uom_id = {units_of_measure.uom_id}'
        relationship: many_to_one
    dimensions:
      - name: purchase_order_item_id
        sql: purchase_order_item_id
        type: number
        primary_key: true
      - name: purchase_order_id
        sql: purchase_order_id
        type: number
      - name: stock_item_id
        sql: stock_item_id
        type: number
      - name: ordered_quantity_value
        sql: ordered_quantity
        type: number
      - name: uom_id
        sql: uom_id
        type: number
      - name: expected_unit_cost
        sql: expected_unit_cost
        type: number
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: ordered_quantity
        type: sum
        sql: ordered_quantity
      - name: expected_purchase_value
        type: sum
        sql: '{CUBE}.ordered_quantity * {CUBE}.expected_unit_cost'
    pre_aggregations:
      - name: purchasing_by_day
        type: rollup
        refresh_key:
          every: 1 minute
        measures:
          - CUBE.count
          - CUBE.ordered_quantity
          - CUBE.expected_purchase_value
        dimensions:
          - purchase_orders.status
          - suppliers.supplier_name
          - branches.branch_name
          - stock_items.stock_item_name
          - units_of_measure.uom_code
        time_dimension: purchase_orders.ordered_at
        granularity: day
