cubes:
  - name: production_batches
    sql: SELECT * FROM bakery.production_batches WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: branches
        sql: '{CUBE}.branch_id = {branches.branch_id}'
        relationship: many_to_one
      - name: employees
        sql: '{CUBE}.produced_by = {employees.employee_id}'
        relationship: many_to_one
      - name: products
        sql: '{CUBE}.product_id = {products.product_id}'
        relationship: many_to_one
      - name: recipes
        sql: '{CUBE}.recipe_id = {recipes.recipe_id}'
        relationship: many_to_one
      - name: units_of_measure
        sql: '{CUBE}.uom_id = {units_of_measure.uom_id}'
        relationship: many_to_one
    dimensions:
      - name: production_batch_id
        sql: production_batch_id
        type: number
        primary_key: true
      - name: batch_number
        sql: batch_number
        type: string
      - name: branch_id
        sql: branch_id
        type: number
      - name: product_id
        sql: product_id
        type: number
      - name: recipe_id
        sql: recipe_id
        type: number
      - name: planned_quantity_value
        sql: planned_quantity
        type: number
      - name: produced_quantity_value
        sql: produced_quantity
        type: number
      - name: uom_id
        sql: uom_id
        type: number
      - name: status
        sql: status
        type: string
      - name: started_at
        sql: started_at
        type: time
      - name: completed_at
        sql: completed_at
        type: time
      - name: produced_by
        sql: produced_by
        type: number
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: planned_quantity
        type: sum
        sql: planned_quantity
      - name: produced_quantity
        type: sum
        sql: produced_quantity
    pre_aggregations:
      - name: production_by_day
        type: rollup
        refresh_key:
          every: 1 minute
        measures:
          - CUBE.count
          - CUBE.planned_quantity
          - CUBE.produced_quantity
        dimensions:
          - branches.branch_name
          - products.product_name
          - CUBE.status
          - units_of_measure.uom_code
        time_dimension: CUBE.completed_at
        granularity: day
