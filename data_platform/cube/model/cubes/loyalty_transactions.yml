cubes:
  - name: loyalty_transactions
    sql: SELECT * FROM bakery.loyalty_transactions WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: customers
        sql: '{CUBE}.customer_id = {customers.customer_id}'
        relationship: many_to_one
      - name: sales
        sql: '{CUBE}.sale_id = {sales.sale_id}'
        relationship: many_to_one
    dimensions:
      - name: loyalty_transaction_id
        sql: loyalty_transaction_id
        type: number
        primary_key: true
      - name: customer_id
        sql: customer_id
        type: number
      - name: sale_id
        sql: sale_id
        type: number
      - name: transaction_type
        sql: transaction_type
        type: string
      - name: points_delta
        sql: points_delta
        type: number
      - name: occurred_at
        sql: occurred_at
        type: time
      - name: idempotency_key
        sql: idempotency_key
        type: string
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: net_points
        type: sum
        sql: points_delta
      - name: points_earned
        type: sum
        sql: CASE WHEN {CUBE}.points_delta > 0 THEN {CUBE}.points_delta ELSE 0 END
      - name: points_redeemed
        type: sum
        sql: CASE WHEN {CUBE}.points_delta < 0 THEN -{CUBE}.points_delta ELSE 0 END
    pre_aggregations:
      - name: loyalty_by_day
        type: rollup
        refresh_key:
          every: 1 minute
        measures:
          - CUBE.count
          - CUBE.net_points
          - CUBE.points_earned
          - CUBE.points_redeemed
        dimensions:
          - customers.customer_code
          - CUBE.transaction_type
        time_dimension: CUBE.occurred_at
        granularity: day
