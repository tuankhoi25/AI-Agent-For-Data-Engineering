cubes:
  - name: goods_receipts
    sql: SELECT * FROM bakery.goods_receipts WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: branches
        sql: '{CUBE}.branch_id = {branches.branch_id}'
        relationship: many_to_one
      - name: purchase_orders
        sql: '{CUBE}.purchase_order_id = {purchase_orders.purchase_order_id}'
        relationship: many_to_one
      - name: employees
        sql: '{CUBE}.received_by = {employees.employee_id}'
        relationship: many_to_one
      - name: suppliers
        sql: '{CUBE}.supplier_id = {suppliers.supplier_id}'
        relationship: many_to_one
    dimensions:
      - name: goods_receipt_id
        sql: goods_receipt_id
        type: number
        primary_key: true
      - name: receipt_number
        sql: receipt_number
        type: string
      - name: purchase_order_id
        sql: purchase_order_id
        type: number
      - name: supplier_id
        sql: supplier_id
        type: number
      - name: branch_id
        sql: branch_id
        type: number
      - name: received_at
        sql: received_at
        type: time
      - name: received_by
        sql: received_by
        type: number
      - name: supplier_invoice_number
        sql: supplier_invoice_number
        type: string
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
