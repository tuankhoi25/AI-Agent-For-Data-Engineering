cubes:
  - name: product_categories
    sql: SELECT * FROM bakery.product_categories WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins:
      - name: product_categories
        sql: '{CUBE}.parent_category_id = {product_categories.category_id}'
        relationship: many_to_one
    dimensions:
      - name: category_id
        sql: category_id
        type: number
        primary_key: true
      - name: category_code
        sql: category_code
        type: string
      - name: category_name
        sql: category_name
        type: string
      - name: parent_category_id
        sql: parent_category_id
        type: number
      - name: description
        sql: description
        type: string
      - name: is_active
        sql: is_active
        type: boolean
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: active_categories
        type: sum
        sql: CASE WHEN {CUBE}.is_active THEN 1 ELSE 0 END
