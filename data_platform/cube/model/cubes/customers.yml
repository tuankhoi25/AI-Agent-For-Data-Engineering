cubes:
  - name: customers
    sql: SELECT * FROM bakery.customers WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins: []
    dimensions:
      - name: customer_id
        sql: customer_id
        type: number
        primary_key: true
      - name: customer_code
        sql: customer_code
        type: string
      - name: full_name
        sql: full_name
        type: string
      - name: phone
        sql: phone
        type: string
      - name: email
        sql: email
        type: string
      - name: date_of_birth
        sql: date_of_birth
        type: time
      - name: joined_at
        sql: joined_at
        type: time
      - name: marketing_consent
        sql: marketing_consent
        type: boolean
      - name: is_active
        sql: is_active
        type: boolean
      - name: notes
        sql: notes
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: active_customers
        type: sum
        sql: CASE WHEN {CUBE}.is_active THEN 1 ELSE 0 END
      - name: marketing_consented_customers
        type: sum
        sql: CASE WHEN {CUBE}.marketing_consent THEN 1 ELSE 0 END
