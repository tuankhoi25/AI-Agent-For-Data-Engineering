cubes:
  - name: allergens
    sql: SELECT * FROM bakery.allergens WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins: []
    dimensions:
      - name: allergen_id
        sql: allergen_id
        type: number
        primary_key: true
      - name: allergen_code
        sql: allergen_code
        type: string
      - name: allergen_name
        sql: allergen_name
        type: string
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
