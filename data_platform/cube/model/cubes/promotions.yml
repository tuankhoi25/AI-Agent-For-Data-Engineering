cubes:
  - name: promotions
    sql: SELECT * FROM bakery.promotions WHERE NOT _is_deleted
    data_source: default
    refresh_key:
      every: 1 minute
    joins: []
    dimensions:
      - name: promotion_id
        sql: promotion_id
        type: number
        primary_key: true
      - name: promotion_code
        sql: promotion_code
        type: string
      - name: promotion_name
        sql: promotion_name
        type: string
      - name: promotion_type
        sql: promotion_type
        type: string
      - name: discount_value
        sql: discount_value
        type: number
      - name: minimum_order_amount
        sql: minimum_order_amount
        type: number
      - name: starts_at
        sql: starts_at
        type: time
      - name: ends_at
        sql: ends_at
        type: time
      - name: max_uses
        sql: max_uses
        type: number
      - name: is_active
        sql: is_active
        type: boolean
      - name: _created_at
        sql: _created_at
        type: time
      - name: _last_updated_at
        sql: _last_updated_at
        type: time
      - name: _is_deleted
        sql: _is_deleted
        type: boolean
      - name: _deleted_at
        sql: _deleted_at
        type: time
    measures:
      - name: count
        type: count
      - name: active_promotions
        type: sum
        sql: CASE WHEN {CUBE}.is_active THEN 1 ELSE 0 END
